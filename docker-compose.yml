services:
  postgres:
    image: postgres:17-alpine
    container_name: eventgrain-postgres
    environment:
      POSTGRES_USER: eventgrain
      POSTGRES_PASSWORD: eventgrain_local_dev
      POSTGRES_DB: eventgrain
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventgrain -d eventgrain"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: eventgrain-redis
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
